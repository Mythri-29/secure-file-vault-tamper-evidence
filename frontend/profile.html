<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Profile - Secure Vault</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#0f172a;
            color:#e2e8f0;
        }

        /* NAV */
        .navbar{
            background:#1e293b;
            padding:18px;
            text-align:center;
            font-size:20px;
            font-weight:600;
        }

        /* LAYOUT */
        .container{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:18px;
            padding:20px;
        }

        /* CARD */
        .card{
            background:#1e293b;
            padding:20px;
            border-radius:12px;
        }

        /* PROFILE HEADER */
        .profile{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .avatar{
            width:60px;
            height:60px;
            border-radius:50%;
            background:#2563eb;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:22px;
            font-weight:bold;
        }

        /* STATS */
        .stat{
            display:flex;
            justify-content:space-between;
            padding:10px 0;
            border-bottom:1px solid #334155;
        }

        /* BADGE */
        .badge{
            padding:4px 10px;
            border-radius:8px;
            font-size:12px;
        }

        .green{background:#14532d;color:#22c55e;}
        .blue{background:#1e3a8a;color:#60a5fa;}
        .red{background:#7f1d1d;color:#ef4444;}

        button{
            width:100%;
            margin-top:15px;
            padding:10px;
            border:none;
            border-radius:8px;
            background:#ef4444;
            color:white;
            cursor:pointer;
        }

        button:hover{
            opacity:0.9;
        }

    </style>
</head>

<body>

<div class="navbar">👤 Secure Vault Profile</div>

<div class="container">

    <!-- LEFT PROFILE -->
    <div class="card">

        <div class="profile">
            <div class="avatar">SV</div>
            <div>
                <h3>Secure Vault User</h3>
                <p style="color:#94a3b8;">USER ROLE</p>
            </div>
        </div>

        <hr style="border:1px solid #334155; margin:15px 0;">

        <div class="stat">
            <span>Total Files</span>
            <span id="totalFiles">0</span>
        </div>

        <div class="stat">
            <span>Verified Files</span>
            <span id="verifiedFiles">0</span>
        </div>

        <div class="stat">
            <span>Audit Logs</span>
            <span id="auditLogs">0</span>
        </div>

        <div class="stat">
            <span>Security Score</span>
            <span class="badge green">98%</span>
        </div>

        <button onclick="logout()">Logout</button>

    </div>

    <!-- RIGHT INFO -->
    <div class="card">

        <h3>System Overview</h3>

        <p>✔ Secure File Upload System</p>
        <p>✔ SHA-256 Integrity Verification</p>
        <p>✔ Tamper Detection Engine</p>
        <p>✔ Audit Trail Logging</p>

        <hr style="border:1px solid #334155;">

        <h4>Quick Actions</h4>

        <button onclick="go('upload.html')" style="background:#2563eb;">Upload File</button>
        <button onclick="go('files.html')" style="background:#3b82f6;">View Files</button>
        <button onclick="go('audit.html')" style="background:#6366f1;">Audit Logs</button>

    </div>

</div>

<script>

    function go(page){
        window.location.href=page;
    }

    function logout(){
        localStorage.removeItem("token");
        window.location.href="login.html";
    }

    /* LOAD STATS */
    async function loadStats(){

        const res = await fetch("http://localhost:8080/files",{
            headers:{
                "Authorization":"Bearer "+localStorage.getItem("token")
            }
        });

        const data = await res.json();

        document.getElementById("totalFiles").innerText=data.length;

        let verified=0;

        data.forEach(f=>{
            if(f.status==="SAFE") verified++;
        });

        document.getElementById("verifiedFiles").innerText=verified;

        /* audit logs */
        let auditCount=0;

        for(let f of data){
            const r = await fetch(`http://localhost:8080/files/audit/${f.id}`,{
                headers:{
                    "Authorization":"Bearer "+localStorage.getItem("token")
                }
            });

            const logs = await r.json();
            auditCount += logs.length;
        }

        document.getElementById("auditLogs").innerText=auditCount;
    }

    window.onload=loadStats;

</script>

</body>
</html>
