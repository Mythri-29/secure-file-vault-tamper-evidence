<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Audit Logs - Secure Vault</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#0f172a;
            color:#e2e8f0;
        }

        .navbar{
            background:#1e293b;
            padding:18px;
            text-align:center;
            font-size:20px;
            font-weight:600;
        }

        .container{
            padding:20px;
        }

        .card{
            background:#1e293b;
            padding:18px;
            border-radius:12px;
            margin-bottom:15px;
        }

        /* SELECT + BUTTON */
        select, button{
            width:100%;
            padding:10px;
            margin-top:10px;
            border-radius:8px;
            border:1px solid #374151;
            background:#0f172a;
            color:#e2e8f0;
            cursor:pointer;
        }

        button:hover{
            background:#1f2937;
        }

        /* LOG BOX */
        .log-box{
            max-height:420px;
            overflow-y:auto;
            margin-top:10px;
            padding:10px;
            border-radius:10px;
            background:#0f172a;
            border:1px solid #1f2937;
        }

        /* LOG ROW */
        .log{
            display:flex;
            justify-content:space-between;
            padding:10px;
            margin-bottom:8px;
            background:#111827;
            border-radius:8px;
        }

        /* LEFT SIDE */
        .left{
            display:flex;
            gap:8px;
            align-items:center;
        }

        /* DOT */
        .dot{
            width:10px;
            height:10px;
            border-radius:50%;
        }

        /* COLORS */
        .upload .dot{ background:#3b82f6; }
        .verify .dot{ background:#22c55e; }
        .download .dot{ background:#facc15; }
        .tamper .dot{ background:#ef4444; }

        .time{
            font-size:12px;
            color:#94a3b8;
        }

        .empty{
            color:#64748b;
        }

    </style>
</head>

<body>

<div class="navbar">
    📊 Audit Logs System
</div>

<div class="container">

    <div class="card">
        <h3>Select File</h3>

        <select id="fileSelect"></select>

        <button onclick="loadAudit()">Load Logs</button>
    </div>

    <div class="card">
        <h3>Activity Timeline</h3>

        <div id="logs" class="log-box empty">
            Select a file to view logs
        </div>
    </div>

</div>

<script>

    function getToken(){
        return localStorage.getItem("token");
    }

    /* LOAD FILES INTO DROPDOWN */
    async function loadFilesForAudit(){

        const res = await fetch("http://localhost:8080/files",{
            headers:{
                "Authorization":"Bearer " + getToken()
            }
        });

        const data = await res.json();

        const select = document.getElementById("fileSelect");
        select.innerHTML = "";

        data.forEach(file => {
            const option = document.createElement("option");
            option.value = file.id;
            option.text = `${file.fileName} (ID: ${file.id})`;
            select.appendChild(option);
        });
    }

    /* LOAD AUDIT LOGS */
    async function loadAudit(){

        const id = document.getElementById("fileSelect").value;

        const res = await fetch(`http://localhost:8080/files/audit/${id}`,{
            headers:{
                "Authorization":"Bearer " + getToken()
            }
        });

        const data = await res.json();

        const logs = document.getElementById("logs");
        logs.classList.remove("empty");
        logs.innerHTML = "";

        data.forEach(log => {

            let cls = "upload";

            if(log.action === "UPLOAD") cls = "upload";
            else if(log.action === "VERIFY") cls = "verify";
            else if(log.action === "DOWNLOAD") cls = "download";
            else if(log.action === "TAMPER") cls = "tamper";

            const dateObj = new Date(log.timestamp);

            const formattedDate = dateObj.toLocaleDateString("en-GB");
            const formattedTime = dateObj.toLocaleTimeString();

            const div = document.createElement("div");
            div.className = `log ${cls}`;

            div.innerHTML = `
                <div class="left">
                    <span class="dot"></span>
                    <span>${log.action}</span>
                </div>

                <div class="time">
                    ${formattedDate} | ${formattedTime}
                </div>
            `;

            logs.appendChild(div);
        });

        if(data.length === 0){
            logs.innerHTML = `<div class="empty">No audit logs found</div>`;
        }
    }

    /* INIT */
    window.onload = function(){
        loadFilesForAudit();
    };

</script>

</body>
</html>
