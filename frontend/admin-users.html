<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault — Manage Users</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        /* ── Page-specific styles ── */
        .users-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .users-search {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 9px 14px;
            flex: 1;
            min-width: 220px;
            transition: border-color 0.2s;
        }

        .users-search:focus-within { border-color: var(--accent); }
        .users-search svg { width: 15px; height: 15px; color: var(--text-3); flex-shrink: 0; }
        .users-search input {
            background: none; border: none; outline: none;
            font-size: 13.5px; color: var(--text-1);
            width: 100%; font-family: var(--sans);
        }
        .users-search input::placeholder { color: var(--text-3); }

        .user-count-label {
            font-size: 12px; color: var(--text-3); font-family: var(--mono);
            white-space: nowrap;
        }

        .user-count-label strong { color: var(--text-2); }

        /* ── Table ── */
        .users-table-wrap {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-3);
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        tbody tr {
            transition: background 0.12s;
            border-bottom: 1px solid var(--border);
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--card-hi); }

        tbody td {
            padding: 13px 18px;
            font-size: 13.5px;
            color: var(--text-1);
            vertical-align: middle;
        }

        .user-avatar-small {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg,#1D3A6E,#2563eb);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: #93C5FD;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .user-name-cell {
            display: flex;
            align-items: center;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            font-family: var(--mono);
            text-transform: uppercase;
        }

        .role-badge.admin {
            background: rgba(139,92,246,0.12);
            color: #C4B5FD;
            border: 1px solid rgba(139,92,246,0.25);
        }

        .role-badge.user {
            background: rgba(59,130,246,0.1);
            color: var(--accent-hi);
            border: 1px solid rgba(59,130,246,0.2);
        }

        .action-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Confirm dialog overlay ── */
        .dialog-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .dialog-overlay.open { display: flex; }

        .dialog-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 28px 32px;
            width: 380px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.5);
            animation: dialogIn 0.25s cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes dialogIn {
            from { opacity:0; transform:scale(0.92) translateY(12px); }
            to   { opacity:1; transform:scale(1) translateY(0); }
        }

        .dialog-box h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: 8px;
        }

        .dialog-box p {
            font-size: 13.5px;
            color: var(--text-2);
            line-height: 1.55;
            margin-bottom: 22px;
        }

        .dialog-box p strong { color: var(--text-1); }

        .dialog-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 18px;
            border-radius: var(--r-md);
            font-size: 13px;
            font-weight: 500;
            z-index: 300;
            display: none;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            animation: toastIn 0.3s cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes toastIn {
            from { opacity:0; transform:translateY(12px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .toast.success {
            display: flex;
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.3);
            color: #86EFAC;
        }

        .toast.error {
            display: flex;
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #FCA5A5;
        }

        .toast svg { width: 16px; height: 16px; flex-shrink: 0; }

        /* ── Empty / loading states ── */
        .table-state {
            padding: 48px;
            text-align: center;
        }

        .table-state svg { width: 36px; height: 36px; color: var(--text-3); margin-bottom: 12px; }
        .table-state h4 { font-size: 15px; color: var(--text-2); margin-bottom: 6px; }
        .table-state p  { font-size: 13px; color: var(--text-3); }

        .spin {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7z"/>
                    <polyline points="9 12 11 14 15 10"/>
                </svg>
            </div>
            <div class="brand-name">Secure <span>Vault</span></div>
        </div>
        <div class="nav-section-label">Platform</div>
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dashboard
        </a>
        <a href="upload.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
            Upload File
        </a>
        <a href="files.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            File Vault
        </a>
        <a href="audit.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Audit Logs
        </a>

        <div class="nav-section-label" data-role="ADMIN" style="display:none;">Administration</div>
        <a href="admin-dashboard.html" class="nav-item" data-role="ADMIN" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
            Admin Dashboard
        </a>
        <a href="admin-users.html" class="nav-item active" data-role="ADMIN" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Manage Users
        </a>

        <div class="nav-section-label">Account</div>
        <a href="profile.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Profile
        </a>

        <div class="sidebar-footer">
            <div class="user-chip" onclick="window.location.href='profile.html'">
                <div class="user-avatar" id="sidebarAvatar">U</div>
                <div class="user-info">
                    <div class="user-name" id="sidebarUser">Loading…</div>
                    <div class="user-role" id="sidebarRole">Vault User</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main-area">
        <div class="topbar">
            <div class="topbar-title">Manage Users</div>
            <div class="topbar-actions">
                <button class="btn btn-ghost" onclick="loadUsers()" title="Refresh">
                    <svg id="refreshIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    Refresh
                </button>
                <button class="icon-btn" onclick="logout()" title="Sign out">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </div>

        <div class="page-content">

            <div class="users-toolbar">
                <div class="users-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" placeholder="Search by username…"
                           oninput="onSearch(this.value)">
                </div>
                <div class="user-count-label">
                    <strong id="userCount">0</strong> users
                </div>
            </div>

            <div class="users-table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>User</th>
                        <th>ID</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    <tr>
                        <td colspan="4">
                            <div class="table-state">
                                <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                                <h4>Loading users…</h4>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="dialog-overlay" id="dialogOverlay">
    <div class="dialog-box">
        <h3 id="dialogTitle">Confirm action</h3>
        <p id="dialogBody">Are you sure?</p>
        <div class="dialog-actions">
            <button class="btn btn-ghost" onclick="closeDialog()">Cancel</button>
            <button class="btn" id="dialogConfirmBtn" onclick="confirmDialogAction()">Confirm</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
    <svg id="toastIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
    <span id="toastText"></span>
</div>

<script src="auth.js"></script>
<script>
    let allUsers  = [];
    let pendingAction = null; // { type: 'role'|'delete', userId, newRole? }
    let currentMe = null;

    // ── Init ──────────────────────────────────────────────────────────
    const me = initAuth(true); // requireAdmin=true — bounces non-admins
    if (me) {
        currentMe = me;
        loadUsers();
    }

    // ── Data loading ──────────────────────────────────────────────────
    async function loadUsers(searchQuery = '') {
        const icon = document.getElementById('refreshIcon');
        icon.classList.add('spin');

        try {
            const url = searchQuery
                ? `${API}/api/admin/users?search=${encodeURIComponent(searchQuery)}`
                : `${API}/api/admin/users`;

            const res = await fetch(url, { headers: authHeaders() });

            if (!res.ok) {
                showTableError('Failed to load users (status ' + res.status + ')');
                return;
            }

            allUsers = await res.json();
            renderTable(allUsers);
        } catch (err) {
            console.error(err);
            showTableError('Cannot reach the server. Is the backend running?');
        } finally {
            icon.classList.remove('spin');
        }
    }

    // debounced search
    let searchTimer;
    function onSearch(val) {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => loadUsers(val.trim()), 350);
    }

    // ── Render ────────────────────────────────────────────────────────
    function renderTable(users) {
        const tbody = document.getElementById('usersTableBody');
        document.getElementById('userCount').textContent = users.length;

        if (users.length === 0) {
            tbody.innerHTML = `
                <tr><td colspan="4">
                    <div class="table-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                        <h4>No users found</h4>
                        <p>Try a different search query.</p>
                    </div>
                </td></tr>`;
            return;
        }

        tbody.innerHTML = '';
        users.forEach(u => {
            const isMe  = (u.username === currentMe?.username);
            const isAdm = (u.role === 'ADMIN');
            const initials = u.username.substring(0, 2).toUpperCase();

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="user-name-cell">
                        <div class="user-avatar-small">${initials}</div>
                        ${escapeHtml(u.username)}
                        ${isMe ? '<span style="font-size:10px;color:var(--text-3);margin-left:6px;font-family:var(--mono);">(you)</span>' : ''}
                    </div>
                </td>
                <td><span class="mono" style="color:var(--text-3);">#${u.id}</span></td>
                <td><span class="role-badge ${isAdm ? 'admin' : 'user'}">${u.role}</span></td>
                <td>
                    <div class="action-cell">
                        ${!isMe ? `
                        <button class="btn btn-ghost" style="font-size:12px;"
                                onclick="promptRoleChange(${u.id}, '${u.username}', '${u.role}')">
                            ${isAdm ? 'Demote to User' : 'Promote to Admin'}
                        </button>
                        <button class="btn btn-danger" style="font-size:12px;"
                                onclick="promptDelete(${u.id}, '${u.username}')">
                            Delete
                        </button>` : `
                        <span style="font-size:12px;color:var(--text-3);">—</span>`}
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function showTableError(msg) {
        document.getElementById('usersTableBody').innerHTML = `
            <tr><td colspan="4">
                <div class="table-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <h4>Error</h4>
                    <p>${escapeHtml(msg)}</p>
                </div>
            </td></tr>`;
    }

    // ── Confirm dialog ────────────────────────────────────────────────
    function promptRoleChange(id, username, currentRole) {
        const newRole  = currentRole === 'ADMIN' ? 'USER' : 'ADMIN';
        const action   = currentRole === 'ADMIN' ? 'Demote to User' : 'Promote to Admin';
        pendingAction  = { type: 'role', userId: id, newRole };

        document.getElementById('dialogTitle').textContent = action;
        document.getElementById('dialogBody').innerHTML =
            `Change <strong>${escapeHtml(username)}</strong>'s role from
             <strong>${currentRole}</strong> to <strong>${newRole}</strong>?`;

        const btn = document.getElementById('dialogConfirmBtn');
        btn.textContent = action;
        btn.className   = newRole === 'ADMIN'
            ? 'btn btn-primary'
            : 'btn btn-danger';

        document.getElementById('dialogOverlay').classList.add('open');
    }

    function promptDelete(id, username) {
        pendingAction = { type: 'delete', userId: id };

        document.getElementById('dialogTitle').textContent = 'Delete User';
        document.getElementById('dialogBody').innerHTML =
            `Permanently delete <strong>${escapeHtml(username)}</strong>?
             This action cannot be undone.`;

        const btn = document.getElementById('dialogConfirmBtn');
        btn.textContent = 'Delete';
        btn.className   = 'btn btn-danger';

        document.getElementById('dialogOverlay').classList.add('open');
    }

    function closeDialog() {
        document.getElementById('dialogOverlay').classList.remove('open');
        pendingAction = null;
    }

    async function confirmDialogAction() {
        closeDialog();
        if (!pendingAction) return;

        if (pendingAction.type === 'role') {
            await changeRole(pendingAction.userId, pendingAction.newRole);
        } else if (pendingAction.type === 'delete') {
            await deleteUser(pendingAction.userId);
        }
    }

    // ── API calls ─────────────────────────────────────────────────────
    async function changeRole(id, newRole) {
        try {
            const res = await fetch(`${API}/api/admin/users/${id}/role`, {
                method: 'PUT',
                headers: { ...authHeaders(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: newRole })
            });

            const data = await res.json();

            if (!res.ok) {
                showToast('error', data.error || 'Failed to update role');
                return;
            }

            showToast('success', `Role updated to ${newRole}`);
            await loadUsers(document.getElementById('searchInput').value.trim());
        } catch (err) {
            showToast('error', 'Request failed: ' + err.message);
        }
    }

    async function deleteUser(id) {
        try {
            const res = await fetch(`${API}/api/admin/users/${id}`, {
                method: 'DELETE',
                headers: authHeaders()
            });

            const data = await res.json();

            if (!res.ok) {
                showToast('error', data.error || 'Failed to delete user');
                return;
            }

            showToast('success', 'User deleted successfully');
            await loadUsers(document.getElementById('searchInput').value.trim());
        } catch (err) {
            showToast('error', 'Request failed: ' + err.message);
        }
    }

    // ── Toast ──────────────────────────────────────────────────────────
    let toastTimer;
    function showToast(type, text) {
        const toast = document.getElementById('toast');
        const icon  = document.getElementById('toastIcon');
        const span  = document.getElementById('toastText');

        toast.className = 'toast ' + type;
        span.textContent = text;
        icon.innerHTML = type === 'success'
            ? '<polyline points="20 6 9 17 4 12"/>'
            : '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.className = 'toast'; }, 3500);
    }

    // ── Utils ──────────────────────────────────────────────────────────
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
    }

    // Close dialog on overlay click
    document.getElementById('dialogOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeDialog();
    });
</script>
</body>
</html>
