<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault — Register</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',Arial,sans-serif; }

        body {
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:radial-gradient(circle at top,#1e293b,#0f172a);
            color:white;
        }

        .register-box {
            width:400px;
            padding:35px;
            background:rgba(30,41,59,0.85);
            backdrop-filter:blur(12px);
            border-radius:16px;
            box-shadow:0 0 40px rgba(0,0,0,0.5);
            text-align:center;
            animation:fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .logo {
            width:60px; height:60px;
            margin:0 auto 12px;
            border-radius:50%;
            background:#2563eb;
            display:flex; align-items:center; justify-content:center;
            font-size:24px; font-weight:bold;
            box-shadow:0 0 20px rgba(37,99,235,0.4);
        }

        h2 { margin-bottom:4px; font-size:22px; font-weight:700; }

        .subtitle {
            font-size:13px;
            color:#94a3b8;
            margin-bottom:24px;
        }

        .form-group {
            text-align:left;
            margin-bottom:14px;
        }

        .form-group label {
            display:block;
            font-size:11px;
            font-weight:600;
            text-transform:uppercase;
            letter-spacing:0.06em;
            color:#94a3b8;
            margin-bottom:6px;
        }

        input {
            width:100%;
            padding:11px 14px;
            border-radius:10px;
            border:1px solid #334155;
            background:#0f172a;
            color:white;
            outline:none;
            font-size:14px;
            transition:border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color:#3b82f6;
            box-shadow:0 0 0 3px rgba(59,130,246,0.15);
        }

        input.error-input { border-color:#ef4444; }

        button.btn-register {
            width:100%;
            padding:12px;
            margin-top:8px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#2563eb,#3b82f6);
            color:white;
            font-weight:600;
            font-size:14px;
            cursor:pointer;
            transition:all 0.2s;
            box-shadow:0 4px 16px rgba(59,130,246,0.3);
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
        }

        button.btn-register:hover:not(:disabled) {
            transform:translateY(-1px);
            box-shadow:0 6px 24px rgba(59,130,246,0.4);
        }

        button.btn-register:disabled { opacity:0.6; cursor:not-allowed; }

        .spinner {
            width:16px; height:16px;
            border:2px solid rgba(255,255,255,0.3);
            border-top-color:#fff;
            border-radius:50%;
            animation:spin 0.6s linear infinite;
            display:none;
        }

        button.btn-register.loading .spinner { display:block; }
        button.btn-register.loading .btn-label { display:none; }

        @keyframes spin { to { transform:rotate(360deg); } }

        .msg-box {
            margin-top:14px;
            padding:10px 14px;
            border-radius:8px;
            font-size:13px;
            font-weight:500;
            display:none;
            align-items:center;
            gap:8px;
            text-align:left;
        }

        .msg-box.error {
            display:flex;
            background:rgba(239,68,68,0.1);
            border:1px solid rgba(239,68,68,0.25);
            color:#fca5a5;
        }

        .msg-box.success {
            display:flex;
            background:rgba(34,197,94,0.1);
            border:1px solid rgba(34,197,94,0.25);
            color:#86efac;
        }

        .login-link {
            margin-top:18px;
            font-size:13px;
            color:#64748b;
        }

        .login-link a {
            color:#60a5fa;
            text-decoration:none;
            font-weight:500;
        }

        .login-link a:hover { text-decoration:underline; }

        .footer {
            margin-top:16px;
            font-size:11px;
            color:#475569;
        }
    </style>
</head>
<body>

<div class="register-box">
    <div class="logo">🔐</div>
    <h2>Create Account</h2>
    <p class="subtitle">Join Secure Vault — all accounts start as USER</p>

    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username" autocomplete="username">
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Choose a password" autocomplete="new-password">
    </div>

    <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password">
    </div>

    <button class="btn-register" id="registerBtn" onclick="register()">
        <div class="spinner"></div>
        <span class="btn-label">Create Account</span>
    </button>

    <div class="msg-box" id="msgBox">
        <span id="msgText"></span>
    </div>

    <div class="login-link">
        Already have an account? <a href="login.html">Sign in</a>
    </div>

    <div class="footer">Protected with SHA-256 Integrity &amp; JWT Security</div>
</div>

<script>
    const API = 'http://localhost:8080';

    function showMsg(type, text) {
        const box  = document.getElementById('msgBox');
        const span = document.getElementById('msgText');
        box.className  = 'msg-box ' + type;
        span.textContent = text;
    }

    function clearErrors() {
        document.getElementById('msgBox').className = 'msg-box';
        ['username','password','confirmPassword'].forEach(id => {
            document.getElementById(id).classList.remove('error-input');
        });
    }

    function setLoading(on) {
        const btn = document.getElementById('registerBtn');
        btn.disabled = on;
        btn.classList.toggle('loading', on);
    }

    async function register() {
        clearErrors();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('confirmPassword').value;

        // Client-side validation
        if (!username) {
            document.getElementById('username').classList.add('error-input');
            showMsg('error', 'Username is required.');
            return;
        }

        if (!password) {
            document.getElementById('password').classList.add('error-input');
            showMsg('error', 'Password is required.');
            return;
        }

        if (password.length < 4) {
            document.getElementById('password').classList.add('error-input');
            showMsg('error', 'Password must be at least 4 characters.');
            return;
        }

        if (password !== confirm) {
            document.getElementById('confirmPassword').classList.add('error-input');
            showMsg('error', 'Passwords do not match.');
            return;
        }

        setLoading(true);

        try {
            const res = await fetch(`${API}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const text = await res.text();

            if (text.toLowerCase().includes('success')) {
                showMsg('success', '✓ Account created! Redirecting to login…');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } else {
                showMsg('error', text || 'Registration failed. Please try again.');
            }
        } catch (err) {
            console.error(err);
            showMsg('error', 'Cannot reach the server. Is the backend running?');
        } finally {
            setLoading(false);
        }
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') register();
    });

    // If already logged in, skip straight to dashboard
    const existing = localStorage.getItem('token');
    if (existing && existing.split('.').length === 3) {
        window.location.href = 'dashboard.html';
    }
</script>
</body>
</html>
